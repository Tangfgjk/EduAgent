 return head('A LITTLE THINKING, EVERY DAY','下午好，林同学。','从上次的思考出发，今天再弄懂一点。',btn(icon('plus')+' 新建学习项目','new-project'))+`<div class="split">${hero}<section class="card"><div class="card-head"><h2>今天的小目标</h2>${pill('已确认')}</div><div class="lesson-title">${esc(current().topic)}</div><p class="muted" style="font-size:12px">能说明顺序，也能独立检查。</p>${steps()}</section></div><div class="section-title"><h2>用不同方式，理解同一个问题</h2>${link('课程与学习安排','course','small ghost')}</div><div class="grid three">${feature('津津陪学','留下思路，在追问中找到自己的依据。','chat','study')}${feature('圆桌讨论','听见不同视角，再作出自己的判断。','round','roundtable')}${feature('我教 AI','把方法讲清楚，回应学伴的疑问。','teach','teach')}</div><div class="grid two section-gap"><section class="card"><div class="card-head"><h2>值得再看一眼</h2>${pill('2道到期','gold')}</div><div class="list-row"><div><h3>括号怎样改变运算顺序？</h3><p>上次使用过提示 · 今天独立复做</p></div>${link('去复习','review','small')}</div></section><section class="card"><div class="card-head"><h2>留下的思考，都有迹可循</h2>${icon('growth')}</div><div class="list-row"><div><h3>本周有12条学习记录</h3><p>查看原始尝试、反思与素养材料</p></div>${link('查看成长','growth','small')}</div></section></div>`;
}

function growth(){const p=route().params,tab=p.get('tab')||'overview',panel=p.get('panel')||'map';let content='';
 if(tab==='overview')content=`<div class="grid four">${stat('学习记录','12','本周 · 每次尝试分别保留')}${stat('覆盖知识点','3','有记录，不代表已经掌握')}${stat('到期复习','2','可以从一次独立尝试开始')}${stat('待评素养材料','8','具体作品，尚未评分')}</div><div class="split section-gap"><section class="card"><div class="card-head"><h2>这一周，你留下了哪些思考？</h2><span class="legend"><i></i>记录条数</span></div>${chart()}<p class="note">曲线表示记录数量，不用于判断学习能力。</p></section><section class="card"><div class="card-head"><h2>下一步，回到具体的问题</h2>${icon('review')}</div><p class="body">2道到期复习中，1道曾在提示后完成。独立再做一次，更能看清自己的理解。</p>${link('开始到期复习','review','primary')}<div class="list-row section-gap"><div><h3>想调整学习节奏？</h3><p>基于这些记录，看看可确认的学习建议。</p></div><a href="#/strategy">${icon('arrow')}</a></div></section></div>`;
 else if(tab==='knowledge')content=subtabs([['map','知识覆盖'],['performance','作答表现']],panel)+`<section class="card"><div class="card-head"><h2>${panel==='performance'?'把独立作答与求助后作答分开看':'练过哪些知识点？'}</h2>${pill('仅当前筛选范围','neutral')}</div>${panel==='performance'?`<div class="bar-list">${[['首次独立检测',4,6],['无提示练习',3,5],['提示后练习',5,7],['原题复习',2,3]].map(([l,a,b])=>`<div class="bar-row"><span>${l}</span><div class="bar-track"><span style="width:${a/b*100}%"></span></div><span>${a} / ${b}</span></div>`).join('')}</div><p class="note">深色为数值通过，分母为提交次数。不同题目与提示条件不能直接作为学习增益比较。</p>`:`<div class="topic-grid">${[['数轴与相反数','4条记录'],['绝对值','3条记录'],['有理数运算','5条记录'],['一元一次方程','暂无记录'],['等可能事件','暂无记录'],['数据与平均数','暂无记录']].map(([n,c],i)=>`<button class="topic-node ${i<3?'active':''}" data-act="source" data-label="${n}"><strong>${n}</strong><small>${c}</small>${pill(i<3?'查看尝试':'尚缺材料',i<3?'':'neutral')}</button>`).join('')}</div>`}</section>`;
 else if(tab==='support')content=subtabs([['map','复习安排'],['help','帮助使用']],panel)+`<section class="card"><div class="card-head"><h2>${panel==='help'?'什么时候用过帮助？':'哪些问题值得再尝试？'}</h2>${link('进入错题与复习','review','small')}</div>${panel==='help'?`<ol class="steps">${[['10.25 · 运算顺序','先独立尝试，再请求一级提示。'],['10.24 · 除法与倒数','遇到困难后恢复具体支持。'],['10.22 · 绝对值','无提示完成数值核验，解释尚待评阅。']].map(([a,b])=>`<li><span class="step-dot">·</span><div><strong>${a}</strong><small>${b}</small><div class="tiny-gap"><button class="text-btn" data-act="source">查看原始尝试 ${icon('arrow')}</button></div></div></li>`).join('')}</ol>`:`<div class="table-wrap"><table><thead><tr><th>触发原因</th><th>到期</th><th>未来安排</th><th></th></tr></thead><tbody>${[['数值未通过',1,2],['提示后完成',1,1],['主动加入复习',0,1]].map(([a,b,c])=>`<tr><td>${a}</td><td>${b}道</td><td>${c}道</td><td><button class="text-btn" data-act="source" data-label="${a}">查看依据</button></td></tr>`).join('')}</tbody></table></div>`}<p class="note">记录帮助使用的过程，不以提示减少直接判断进步。</p></section>`;
 else if(tab==='competency')content=`<div class="callout"><div><strong>看见具体的思考，不急着打分。</strong>以下是可供观察的材料数量，不是六维能力得分。</div>${pill('尚未评分','neutral')}</div><section class="card"><div class="card-head"><h2>六类素养材料</h2><small>点击一行，查看对应作品</small></div><div class="bar-list">${[['数学抽象',2],['逻辑推理',3],['数学建模',1],['直观想象',2],['数学运算',5],['数据分析',1]].map(([n,v])=>`<button class="bar-row" style="background:transparent;text-align:left;color:inherit" data-act="source" data-label="${n}"><span>${n}</span><span class="bar-track"><span style="width:${v/6*100}%"></span></span><span>${v}条 ${icon('arrow')}</span></button>`).join('')}</div><p class="note">维度可以重叠。材料不足表示尚缺观察依据，不表示能力为零。</p></section>`;
 else content=`<div class="split"><section class="card"><div class="card-head"><h2>2026年10月</h2>${pill('演示月份','neutral')}</div><div class="calendar">${['一','二','三','四','五','六','日'].map(d=>`<span class="weekday">${d}</span>`).join('')}${Array.from({length:3},()=>'<span></span>').join('')}${Array.from({length:31},(_,i)=>`<button class="day ${[5,9,12,15,19,20,22,24,25].includes(i+1)?'filled':''} ${state.day===i+1?'selected':''}" data-act="day" data-day="${i+1}" aria-label="10月${i+1}日">${i+1}</button>`).join('')}</div><p class="note">有底色的日期留有演示学习记录。</p></section><section class="card"><div class="card-head"><h2>10月${state.day}日 · 学习记录</h2><small>2条演示记录</small></div>${[['独立尝试','我先确定乘除，再处理加减。'],['我的反思','括号改变顺序，要先看清条件。']].map(([n,t])=>`<div class="list-row"><div><h3>${n}</h3><p>${t}</p></div><button class="text-btn" data-act="source" data-label="${n}">查看</button></div>`).join('')}<p class="note">每条记录可追溯至当时的题目、表达和帮助情况。</p></section></div>`;
 const nav=CONFIG.theme==='a'?tabNav(growthTabs,tab):`<nav class="growth-local-nav" aria-label="成长内容分类">${growthTabs.map(([id,n,d])=>`<button aria-current="${tab===id?'page':'false'}" data-route="growth" data-key="tab" data-value="${id}"><strong>${n}</strong><small>${d}</small></button>`).join('')}</nav>`;
 return head('UNDERSTAND YOUR OWN LEARNING','每一次思考，都有迹可循。','从概览到具体作品，找到你想看的学习依据。',`<div class="filters"><select aria-label="成长范围" data-change="scope"><option value="project" ${p.get('scope')!=='global'?'selected':''}>当前项目</option><option value="global" ${p.get('scope')==='global'?'selected':''}>全部正式项目</option></select><select aria-label="时间范围" data-change="days">${[14,30,90].map(n=>`<option value="${n}" ${(p.get('days')||'30')===String(n)?'selected':''}>最近${n}天</option>`).join('')}</select></div>`)+`<p class="range-note">${p.get('scope')==='global'?'全部正式项目 · 排除临时会话':'当前项目：'+esc(current().name)} · 演示数据</p><div class="${CONFIG.theme==='b'?'growth-workspace':''}">${nav}<div id="growth-panel" role="tabpanel">${content}</div></div>`;
}
function messages(kind){const key=state.project+':'+kind;return state.chats[key]||(state.chats[key]=[{who:'ai',text:kind==='teach'?'我想听听你的方法。'+lesson().question:kind==='roundtable'?'先说说自己的判断。'+lesson().question:lesson().question}]);}
function chat(){const kind=route().page,independent=route().params.get('phase')==='check',mode=state.modes[kind]||'answer';const title={study:'津津陪学',roundtable:'圆桌讨论',teach:'我教 AI'}[kind];
 const talk=messages(kind).map(m=>`<div class="message ${m.who==='me'?'me':''}"><span class="avatar">${m.who==='me'?'我':kind==='teach'?'伴':'津'}</span><div><div class="by">${m.who==='me'?'我的表达':kind==='teach'?'虚拟学伴 · 演示回应':'津津 · 演示回应'}</div><div class="bubble">${esc(m.text)}</div></div></div>`).join('');
 const active=state.activeTask;if(active&&active!==kind)return head('ONE THING AT A TIME',title,'当前项目还有一段未完成的学习。')+`<section class="card empty">${icon('clock')}<h2>先接着刚才的思考</h2><p>你正在${{study:'陪学',roundtable:'圆桌讨论',teach:'我教 AI'}[active]}中。可以继续原活动，或明确结束后切换；已有记录会保留。</p><div class="actions" style="justify-content:center">${link('继续原活动',active,'primary')}${btn('结束原活动，进入'+title,'switch-activity','',`data-target="${kind}"`)}</div></section>`;
 return head(kind==='study'?'THINK IT THROUGH':kind==='roundtable'?'ONE QUESTION, DIFFERENT VIEWS':'EXPLAIN TO UNDERSTAND',title,kind==='study'?'留下思路、请求帮助，再用自己的方式核验。':kind==='roundtable'?'先表达，再比较观点，最后用依据修正。':'讲给学伴听，把隐约理解的地方说清楚。',btn('结束本次学习','end-activity','small ghost'))+context()+ (kind==='roundtable'?`<div class="voices">${[['提出者','先选一种表示','能不能把运算顺序标在算式上？'],['质疑者','检查适用前提','如果增加括号，先后顺序会怎样变化？'],['整理者','找到下一步','比较之后，你准备怎样检查自己的判断？']].map(([n,d,t],i)=>`<section class="voice"><span class="avatar">${i+1}</span><h3>${n}</h3><small>${d}</small><p>${t}</p></section>`).join('')}</div>`:'')+`<div class="chat-layout"><section class="card chat-card"><div class="task-head"><div class="card-head" style="margin:0"><span class="eyebrow" style="margin:0">${independent?'INDEPENDENT CHECK':'CURRENT QUESTION'}</span>${pill(independent?'独立检测 · 无提示':kind==='study'?'练习 3 / 7':'围绕当前课程',independent?'gold':'')}</div><h2>${kind==='teach'?'把你的运算方法讲给学伴听':kind==='roundtable'?'这样的运算顺序合理吗？':'先确定顺序，再说明依据'}</h2><div class="formula">${lesson().formula}</div><small>${lesson().task} 数值与解释分别保留。</small></div><div class="transcript" aria-live="polite">${talk}</div><form class="composer" id="chat-form"><div class="chat-modes">${(kind==='study'?['answer','discuss']:['discuss']).map(m=>`<button type="button" class="${mode===m||kind!=='study'?'active':''}" data-act="chat-mode" data-mode="${m}">${m==='answer'?'回答这道题':'交流思路与问题'}</button>`).join('')}${independent?pill('请独立完成','gold'):''}</div><label class="sr-only" for="chat-input">${kind==='teach'?'我的讲解':'我的回答'}</label><textarea id="chat-input" required maxlength="1200" placeholder="${kind==='teach'?'试着说清规则、适用条件和检查方法…':mode==='answer'?'例如：这个答案是10，因为我先算…':'写下你的问题，或接着上一轮回应…'}"></textarea><div class="composer-footer">${independent?'<small>完成后可查看学习回顾</small>':btn(icon('spark')+' 给我一点提示','hint','small ghost')}<button class="btn primary" type="submit">${icon('arrow')} 发送</button></div></form></section><aside class="support-side stack"><section class="card support-card"><div class="small-heading">这一轮，聚焦一件事</div><h3>${esc(current().topic)}</h3><p>目标：${lesson().goal}</p><div class="thought-list"><span>先表达自己的判断</span><span>有疑问可以恢复帮助</span><span>独立检测保留真实尝试</span></div>${link('查看课堂讲解','classroom','small')}</section><section class="card support-card"><div class="card-head"><h3>学习进度</h3>${icon('clock')}</div>${steps()}${kind==='study'&&!independent?btn('体验独立检测','independent','small ghost'):''}</section></aside></div>`;
}
function classroom(){const i=state.scene,slides=[['先确定运算顺序','−2 + 3 × 4','没有括号时，先乘除，再加减。同级运算从左到右。','计算这个式子，结果是多少？','10'],['把除法转成乘法','(−6) ÷ (−2) = 3','除数不能为零。除以一个非零数，等于乘它的倒数。','负六除以负二，结果是多少？','3'],['换一种情况，再检查','(−2 + 3) × 4','加入括号后，先处理括号内部，再进行乘法。','计算这个式子，结果是多少？','4']],s=slides[i];
 return head('AN INTERACTIVE WAY TO UNDERSTAND','互动课堂','听讲解、停下来思考，把理解放回具体的问题。',link('课后陪学练习','study','primary'))+context()+`<div class="classroom-layout"><nav class="scene-nav" aria-label="课堂场景">${slides.map((a,n)=>`<button class="scene-btn ${n===i?'active':''}" data-act="scene" data-scene="${n}" aria-current="${n===i?'step':'false'}"><span>0${n+1}</span><strong>${a[0]}</strong></button>`).join('')}</nav><div><section class="slide"><small>有理数 · 概念与条件</small><h2>${s[0]}</h2><div class="formula">${s[1]}</div><p>${s[2]}</p><span class="number">0${i+1}</span></section><div class="classroom-controls">${btn(icon('play')+' 听本机讲解','narrate','small')}${btn('上一页','previous-scene','small ghost',i===0?'disabled':'')}${btn('下一页 '+icon('arrow'),'next-scene','small primary',i===2?'disabled':'')}<small>第 ${i+1} / 3 页 · 自编演示课堂</small></div><section class="card question"><div class="card-head" style="margin-bottom:5px"><h3>停下来，自己试一下</h3>${pill('课堂练习','neutral')}</div><p>${s[3]}</p><form id="class-answer"><label class="sr-only" for="class-input">课堂回答</label><input id="class-input" required placeholder="写下一个数值，例如：我的答案是…"/><button class="btn primary" type="submit">检查回答</button></form><p id="class-feedback" role="status" class="note"></p></section><section class="card section-gap"><div class="card-head"><h3>再用数轴看一眼</h3>${btn('播放5秒动画','animation','small ghost')}</div><div class="number-animation"><i class="moving-point"></i>${['−2','−1','0','1','2','3'].map(n=>`<span>${n}</span>`).join('')}</div><p class="note">本地动画仅用于演示媒体位置；正式课堂的生成内容按实际资源展示。</p></section></div></div>`;

function toast(text){const el=document.createElement('div');el.className='toast';el.textContent=text;$('#toasts').replaceChildren(el);setTimeout(()=>el.remove(),3300);}
let previousFocus=null;
function modal(title,body,drawer=false){previousFocus=document.activeElement;$('#overlay').innerHTML=`<div class="overlay ${drawer?'drawer-overlay':''}" data-backdrop><section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal ${drawer?'drawer':''}"><div class="modal-head"><h2>${esc(title)}</h2><button class="close" aria-label="关闭对话框" data-act="close">×</button></div>${body}</section></div>`;const el=$('#overlay input:not([type=checkbox]),#overlay textarea,#overlay button');el?.focus();}
function close(){if(!$('#overlay').children.length)return;if('speechSynthesis'in window)window.speechSynthesis.cancel();$('#overlay').innerHTML='';previousFocus?.focus();}
function source(label='学习尝试'){modal(label+' · 原始依据',`<span class="eyebrow">当前项目 · 原始演示记录</span><div class="source-quote">我先做乘法，再做加法。因为没有括号时乘法优先，但我还想检查负号有没有处理正确。</div><div class="list-row"><div><h3>当时的题目</h3><p>−2 + 3 × 4</p></div>${pill('练习')}</div><div class="list-row"><div><h3>数值与帮助</h3><p>最终数值10 · 使用过一级提示</p></div></div><div class="list-row"><div><h3>我的反思</h3><p>下次先把顺序写下来，再独立核对。</p></div></div><p class="note">本材料可以支持观察，尚未评定解释质量或素养。</p><label class="field section-gap">补充自己的观察<textarea placeholder="写下现在回看时的新想法…"></textarea></label><div class="actions">${btn('保存演示注记','save-note','primary')}</div>`,true);}
let onboarding={step:1,topic:'',kind:'项目',name:''};
function onboard(){const {step,topic,kind}=onboarding;modal(kind==='临时'?'开始一次临时探索':'从一个想弄懂的问题开始',`<div class="onboard-steps">${[1,2,3].map(n=>`<span class="${n<=step?'active':''}"></span>`).join('')}</div><p class="body-copy">${step===1?'先说明你想学什么；准备好以后，再由你确认。':step===2?'用一次小尝试看清起点，不确定也可以如实表达。':'以下是演示安排。确认后才进入新学习空间。'}</p><form id="onboard-form">${step===1?`<label class="field">我想学什么？<textarea name="topic" required minlength="2" maxlength="120" placeholder="例如：为什么负数除以负数得到正数？">${esc(topic)}</textarea></label><div class="actions" style="justify-content:flex-start">${['有理数混合运算','等可能事件概率','一元一次方程'].map(t=>btn(t,'topic-preset','small ghost',`data-label="${t}"`)).join('')}</div>`:step===2?`<div class="callout"><div><strong>${esc(topic)}</strong>演示诊断：先说明自己的判断。</div></div><p>−2 + 3 × 4，你准备先做哪一步？</p><label class="field tiny-gap">我的想法<textarea name="attempt" required placeholder="写下你的想法，也可以写‘还不确定’"></textarea></label>`:`<div class="callout"><div><strong>${esc(topic)}</strong>先理解条件 → 陪学练习 → 独立检查</div></div><label class="field">空间名称<input name="name" required value="${esc(topic)}"/></label><label class="field section-gap">这次愿意投入<select><option>15分钟</option><option>20分钟</option><option>30分钟</option></select></label><p class="note">本流程模拟主题、诊断和确认，没有调用模型或创建真实课程。</p>`}<div class="actions">${step>1?btn('上一步','onboard-back','ghost'):btn('取消','close','ghost')}<button type="submit" class="btn primary">${step===3?'我确认，进入学习空间':'下一步 '+icon('arrow')}</button></div></form>`);}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act],[data-param],[data-route]');if(!a)return;
 if(a.dataset.param||a.dataset.route){const r=route(),p=new URLSearchParams(r.params);p.set(a.dataset.key||a.dataset.param,a.dataset.value);if(a.dataset.route)p.delete('panel');go(a.dataset.route||r.page,Object.fromEntries(p));return;}
 const act=a.dataset.act;
 if(act==='close'){close();return;}if(act==='menu'){$('.sidebar').classList.toggle('open');return;}
 if(act==='new-project'||act==='temporary'||act==='new-topic'){onboarding={step:1,topic:a.dataset.label||'',kind:act==='temporary'?'临时':'项目'};onboard();return;}
 if(act==='topic-preset'){$('#onboard-form textarea').value=a.dataset.label;return;}
 if(act==='onboard-back'){onboarding.step--;onboard();return;}
 if(act==='source'){source(a.dataset.label);return;}
 if(act==='day'){state.day=Number(a.dataset.day);shell();return;}
 if(act==='enter'){state.project=a.dataset.id;go('home');shell();return;}
 if(act==='archive'||act==='restore'){const p=state.projects.find(p=>p.id===a.dataset.id);if(act==='archive')modal('归档这个学习项目？',`<p class="body-copy">「${esc(p.name)}」的记录会保留。你可以在“已归档”中恢复。</p><div class="actions">${btn('取消','close')}${btn('确认归档','archive-confirm','primary',`data-id="${p.id}"`)}</div>`);else{p.archived=false;toast('演示项目已恢复');shell();}return;}
 if(act==='archive-confirm'){state.projects.find(p=>p.id===a.dataset.id).archived=true;if(current().archived)state.project=state.projects.find(p=>!p.archived)?.id||'rational';close();shell();toast('已归档，记录仍然保留');return;}
 if(act==='rename'){const p=state.projects.find(p=>p.id===a.dataset.id);modal('重命名学习空间',`<form id="rename-form" data-id="${p.id}"><label class="field">空间名称<input name="name" required minlength="2" maxlength="80" value="${esc(p.name)}"/></label><div class="actions"><button class="btn primary">保存名称</button></div></form>`);return;}
 if(act==='today'){go('course',{tab:'plan'});return;}
 if(act==='chat-mode'){state.modes[route().page]=a.dataset.mode;shell();return;}
 if(act==='hint'){if(route().params.get('phase')==='check'){toast('独立检测期间不提供提示');return;}const key=state.project+':'+route().page,n=state.hints[key]||0;const hints=lesson().hints;messages(route().page).push({who:'ai',text:hints[Math.min(n,2)]});state.hints[key]=n+1;state.activeTask=route().page;shell();return;}
 if(act==='independent'){modal('进入一次独立尝试',`<p class="body-copy">独立检测时不会展示提示与课堂辅助。此处仅演示操作状态，正式系统会继续执行后台隔离。</p><div class="actions">${btn('继续练习','close')}${btn('开始独立尝试','confirm-independent','primary')}</div>`);return;}
 if(act==='confirm-independent'){close();go('study',{phase:'check'});return;}
 if(act==='end-activity'){modal('结束本次学习？',`<p class="body-copy">已留下的表达会保留，可以稍后查看。结束后可以选择另一条学习路线。</p><div class="actions">${btn('继续学习','close')}${btn('保存并结束','confirm-end','primary')}</div>`);return;}
 if(act==='confirm-end'){state.activeTask=null;close();go('home');toast('演示活动已结束，记录已保留');return;}
 if(act==='switch-activity'){modal('结束后切换学习路线',`<p class="body-copy">保留原活动的演示表达，结束后进入新路线。</p><div class="actions">${btn('取消','close')}${btn('确认切换','confirm-switch','primary',`data-target="${a.dataset.target}"`)}</div>`);return;}
 if(act==='confirm-switch'){state.activeTask=null;close();go(a.dataset.target);shell();return;}
 if(act==='scene'||act==='next-scene'||act==='previous-scene'){state.scene=act==='scene'?Number(a.dataset.scene):Math.max(0,Math.min(2,state.scene+(act==='next-scene'?1:-1)));if('speechSynthesis'in window)window.speechSynthesis.cancel();shell();return;}
 if(act==='animation'){const p=$('.moving-point');p.classList.remove('playing');void p.offsetWidth;p.classList.add('playing');toast('正在播放本地数轴动画');return;}
 if(act==='narrate'){const voice=window.speechSynthesis?.getVoices().find(v=>v.localService&&v.lang.startsWith('zh'));if(!voice){toast('没有可用的本机中文音色，可以继续阅读文字。');return;}const u=new SpeechSynthesisUtterance($('.slide p').textContent);u.voice=voice;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);return;}
 if(act==='review-answer'){modal('独立再试一次',`<span class="eyebrow">原题复做 · 演示核验</span><div class="formula">${Number(a.dataset.index)?'(−6) ÷ (−2)':'−2 + 3 × 4'}</div><form id="review-form" data-index="${a.dataset.index}"><label class="field">我的回答<input name="answer" required placeholder="请明确一个数值"/></label><p id="review-feedback" class="note" role="status"></p><div class="actions"><button class="btn primary">检查本次回答</button></div></form>`);return;}
 if(act==='rollback'){state.policy=false;state.proposal=false;toast('已恢复原来的演示安排');shell();return;}
 if(act==='accept-policy'){state.policy=true;state.proposal=false;toast('你已确认建议，后续演示任务采用新安排');shell();return;}
 if(act==='decline-policy'){state.proposal=false;toast('保留原来的安排');shell();return;}
 if(act==='auto'){state.auto=!state.auto;if(!state.auto)state.trial=false;shell();toast(state.auto?'已开启演示自动建议':'已关闭，恢复原有演示策略');return;}
 if(act==='skill-candidate'){modal('查看一次小调整',`<p class="body-copy">依据：近期有符号相关求助记录。建议先复练对应题目，仍需观察效果。</p><div class="diff"><div><small>原安排</small><p>按课程顺序练习</p></div><div><small>候选安排</small><p>相关错题优先</p></div></div><p class="note">仅演示受限个人试用，不代表教学效果已验证。</p><div class="actions">${btn('暂不试用','close')}${btn('我同意个人试用','trial','primary')}</div>`);return;}
 if(act==='trial'){state.trial=true;close();shell();toast('演示个人试用已开启，可以随时撤回');return;}
 if(act==='withdraw'){state.trial=false;shell();toast('已撤回演示试用，恢复原安排');return;}
 if(act==='save-note'){close();toast('演示注记已保存，仅在本次预览中有效');return;}
 if(act==='toggle'){a.setAttribute('aria-checked',a.getAttribute('aria-checked')!=='true');return;}
 if(act==='help'){modal('两套界面，比较同一条学习路径',`<p class="body-copy">这是${CONFIG.theme.toUpperCase()}版交互原型，所有统计、对话和反馈都是自编演示数据，不连接正式账号、模型或数据库。</p><ol class="steps"><li><span class="step-dot">1</span><div><strong>从主题进入学习</strong><small>新建目标 → 小诊断 → 确认安排</small></div></li><li><span class="step-dot">2</span><div><strong>体验三条学习路线</strong><small>陪学、圆桌、我教AI各有清楚入口</small></div></li><li><span class="step-dot">3</span><div><strong>回看成长，再调整方式</strong><small>五类成长信息按需查看，建议由你确认</small></div></li></ol><div class="actions"><a class="btn" href="${CONFIG.theme==='a'?'b':'a'}-${CONFIG.role}.html">打开另一版</a>${btn('开始体验','close','primary')}</div>`);return;}
 if(act==='privacy'){modal('演示数据与隐私',`<p class="body-copy">本原型不读取学习账号、浏览器登录凭据或本机密钥。操作只影响当前页面内存，刷新后复原。正式产品仍按项目归属、授权用途与独立检测规则执行。</p><div class="actions">${btn('知道了','close','primary')}</div>`);return;}
 if(act==='password'){modal('修改演示密码',`<form id="password-form" class="form-grid"><label class="field full">新密码（至少6位）<input type="password" name="password" required minlength="6" autocomplete="new-password"/></label><label class="field full">再输入一次<input type="password" name="confirm" required minlength="6" autocomplete="new-password"/></label><p class="note field full">请勿输入真实密码；这里仅演示校验。</p><div class="actions field full"><button class="btn primary">确认修改</button></div></form>`);return;}
 if(act==='new-student'){modal('创建演示学生账号',`<form id="student-form" class="form-grid"><label class="field">显示名称<input name="name" required/></label><label class="field">登录账号<input name="id" required/></label><label class="field full">初始演示密码<input type="password" name="password" required minlength="6" placeholder="至少6位，请勿输入真实密码"/></label><div class="actions field full"><button class="btn primary">创建演示账号</button></div></form>`);return;}
 if(act==='student-status'){const s=state.students[Number(a.dataset.index)];s.status=s.status==='正常'?'已停用':'正常';shell();toast('演示账号状态已更新');return;}
 if(act==='admin-detail'){modal(a.dataset.label,`<span class="eyebrow">原始依据与处理动作</span><p class="body-copy">核对范围：当前课程、自编开发内容、来源与概念条件。处理结论不代表真实教学效果。</p><div class="source-quote">有理数混合运算先处理括号，再乘除，最后加减。检查除数非零和负号。</div><label class="field">处理依据<textarea id="review-note" placeholder="写下已核对的范围与仍待验证的内容…"></textarea></label><div class="actions">${btn('保留待复核','close')}${btn('保存演示处理结论','approve','primary',`data-id="${a.dataset.id}"`)}</div>`,true);return;}
 if(act==='approve'){if(!$('#review-note').value.trim()){toast('请先填写处理依据');$('#review-note').focus();return;}state.approved.push(a.dataset.id);close();shell();toast('演示处理记录已保存');return;}
 if(act==='pause-media'){state.paused=true;shell();toast('演示媒体批次已暂停');return;}
 if(act==='media-admin'){modal('预算与错误 · 管理视图',`<p class="body-copy">演示总上限¥5，预占¥1.10776，实际账单待核对。2张图片和1段视频已可用，配音尚未通过。</p><div class="list-row"><div><h3>故障定位建议</h3><p>检查供应商状态与请求标识。未知结果不自动重试。</p></div></div><p class="note">这些是设计演示状态，不是本次调用或实时账单。</p><div class="actions">${btn('关闭','close','primary')}</div>`,true);return;}
 if(['connection','admin-help','effect-help'].includes(act)){modal(act==='effect-help'?'教学效果验证条件':'管理操作说明',`<p class="body-copy">${act==='connection'?'此原型不执行网络连接测试。正式系统应分别展示鉴权、模型可见性和生成验收，不能混为“已验证”。':act==='effect-help'?'工程评测、真实策略暴露、专业量规、等值测验和真实试点条件需要分别核对。当前示例保留效果待验证。':'优先查看事项详情与原始依据，再明确记录处理结论。常规学生功能在平台预先授权范围内执行。'}</p><div class="actions">${btn('知道了','close','primary')}</div>`);return;}
});
document.addEventListener('change',e=>{const type=e.target.dataset.change;if(type==='project'){state.project=e.target.value;shell();toast('已切换学习空间，示例对话按空间分开');}else if(type){const r=route();r.params.set(type,e.target.value);go(r.page,Object.fromEntries(r.params));}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();
 if(f.id==='onboard-form'){const data=new FormData(f);if(onboarding.step===1)onboarding.topic=data.get('topic').trim();if(onboarding.step<3){onboarding.step++;onboard();}else{const p={id:'project-'+Date.now(),name:data.get('name').trim(),topic:onboarding.topic,kind:onboarding.kind,archived:false,fresh:true};state.projects.push(p);state.project=p.id;state.activeTask=null;close();go('home');shell();toast('演示学习空间已准备好，从首页继续');}return;}
 if(f.id==='rename-form'){state.projects.find(p=>p.id===f.dataset.id).name=new FormData(f).get('name').trim();close();shell();return;}
 if(f.id==='chat-form'){const text=$('#chat-input').value.trim(),kind=route().page;messages(kind).push({who:'me',text});state.activeTask=kind;const mode=state.modes[kind]||'answer';let reply=kind==='teach'?'你讲到了自己的方法。'+lesson().question:kind==='roundtable'?'你提到了自己的依据。比较三种视角后，哪条前提最值得先检查？请用这道题说明。':mode==='discuss'?'你提到了“'+text.slice(0,25)+'”。能指出你最不确定的是运算顺序，还是负号处理吗？':demoAnswer(text,lesson().expected)?'这份演示中，最终数值'+lesson().expected+'与参考值一致。请再说说所用条件和方法；数值通过不等于解释已经评阅。':'我还不能确认你的最终数值。可以先明确一个答案，再一起核对运算顺序。';messages(kind).push({who:'ai',text:reply});shell();return;}
 if(f.id==='class-answer'){const expected=['10','3','4'][state.scene],text=$('#class-input').value;$('#class-feedback').textContent=demoAnswer(text,expected)?'演示核验：数值与参考值一致。解释质量另行评阅。':'演示核验：请再核对运算顺序与符号，或明确一个数值。';return;}
 if(f.id==='review-form'){const n=Number(f.dataset.index),answer=new FormData(f).get('answer');if(demoAnswer(String(answer),n?'3':'10')){state.reviewed.push(n);close();shell();toast('演示数值核验通过，复习记录已更新');}else $('#review-feedback').textContent='请再检查运算顺序与符号。此处使用固定演示参考值。';return;}
 if(f.id==='strategy-form'){state.proposal=true;shell();toast('已准备一份演示建议，请比较后确认');document.querySelector('.diff')?.scrollIntoView({behavior:'smooth',block:'center'});return;}
 if(f.id==='student-form'){const data=new FormData(f);if(state.students.some(s=>s.id===data.get('id'))){toast('该演示账号已存在');return;}state.students.push({name:data.get('name'),id:data.get('id'),status:'正常'});close();shell();toast('演示学生账号已创建');return;}
 if(f.id==='password-form'){const d=new FormData(f);if(d.get('password')!==d.get('confirm')){toast('两次演示密码不一致');return;}close();toast('已完成演示校验，没有修改真实密码');return;}
 if(f.id==='plan-form'||f.id==='admin-config'){toast(f.id==='plan-form'?'演示学习安排已由你确认':'演示配置已保存，未改变正式系统');return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();$('.sidebar')?.classList.remove('open');}if(e.key==='Tab'&&$('#overlay [role=dialog]')){const nodes=[...$('#overlay [role=dialog]').querySelectorAll('button,a[href],input,textarea,select')].filter(n=>!n.disabled);if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.addEventListener('click',e=>{if(e.target.matches('[data-backdrop]'))close();});
window.addEventListener('hashchange',()=>{close();shell();window.scrollTo({top:0,behavior:'instant'});$('#main')?.focus({preventScroll:true});});
shell();
</script></body></html>
