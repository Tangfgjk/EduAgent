[project]
name = "rsi-platform"
version = "0.1.0"
description = "RSI 教育智能体平台 v1 —— M0 最小闭环 + L0 进化演示"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sympy>=1.12",
    "httpx>=0.27",
    "sqlalchemy>=2.0.54,<2.1",
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.3,<4",
    "argon2-cffi>=25.1,<26",
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langsmith>=0.14.11,<0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evolution"]

[tool.hatch.build.targets.wheel.force-include]
"seeds/question_bank.json" = "seeds/question_bank.json"
"web/index.html" = "web/index.html"
"seeds/evaluation/probability_followup.v1.json" = "seeds/evaluation/probability_followup.v1.json"
"seeds/evaluation/probability_multiturn.v1.json" = "seeds/evaluation/probability_multiturn.v1.json"
"seeds/evaluation/probability_multiturn_holdout.v1.json" = "seeds/evaluation/probability_multiturn_holdout.v1.json"
"seeds/evaluation/probability_multiturn_regression.v1.json" = "seeds/evaluation/probability_multiturn_regression.v1.json"
"seeds/evaluation/probability_teach.v1.json" = "seeds/evaluation/probability_teach.v1.json"
"seeds/evaluation/probability_teach_multiturn.v1.json" = "seeds/evaluation/probability_teach_multiturn.v1.json"
"seeds/evaluation/probability_roundtable.v1.json" = "seeds/evaluation/probability_roundtable.v1.json"
"seeds/evaluation/planning_sources.v1.json" = "seeds/evaluation/planning_sources.v1.json"
"seeds/evaluation/reports" = "seeds/evaluation/reports"

[tool.hatch.build.targets.sdist]
include = ["/app", "/evolution", "/seeds/question_bank.json", "/seeds/evaluation", "/web/index.html", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/.python-version", "/.env.example", "/README.md", "/compose.dev.yml"]
