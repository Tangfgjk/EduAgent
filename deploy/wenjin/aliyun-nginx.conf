# Public HTTP acceptance on 8088; retain the existing port 80 site.
# Enable HTTPS and Secure cookies together before a formal public launch.
map $http_upgrade $wenjin_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8088;
    server_name 47.111.38.174;
    if ($host !~ ^(47[.]111[.]38[.]174|localhost|127[.]0[.]0[.]1)$) { return 421; }
    client_max_body_size 210m;
    location / {
        proxy_pass http://127.0.0.1:3782;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wenjin_connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
