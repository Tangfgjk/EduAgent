# HTTPS on the already-open application port; port 80 remains the existing site.
map $http_upgrade $wenjin_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8088 ssl;
    server_name 47.111.38.174;
    ssl_certificate /etc/letsencrypt/live/guiziwenjin-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guiziwenjin-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:wenjinTLS:10m;
    ssl_session_timeout 1d;
    # Handle an old plain-HTTP bookmark without needing a second public port.
    error_page 497 =307 https://47.111.38.174:8088$request_uri;
    if ($host !~ ^(47[.]111[.]38[.]174|localhost|127[.]0[.]0[.]1)$) { return 421; }
    add_header Permissions-Policy "microphone=(self)" always;
    client_max_body_size 210m;
    location / {
        proxy_pass http://127.0.0.1:3782;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wenjin_connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
