# Install as an additional site. Do not replace other sites or nginx.conf.
# This HTTP upstream must be restricted to the approved campus gateway/network.
map $http_upgrade $wenjin_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8088;
    server_name wenjin.ccnu.edu.cn 10.222.10.245;
    # Replace the domain with the actually approved hostname; backup is not enabled by default.
    client_max_body_size 210m;
    location / {
        proxy_pass http://127.0.0.1:3782;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wenjin_connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
