[project]
name = "rsi-platform"
version = "0.1.0"
description = "RSI 教育智能体平台 v1 —— M0 最小闭环 + L0 进化演示"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sympy>=1.12",
    "httpx>=0.27",
    "pypdf>=6.0",
    "markdown-it-py>=3.0",
    "psycopg[binary]>=3.2",
    "rapidocr-onnxruntime>=1.4.4",
    "pypdfium2>=5.0",
    "pillow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.15.7", "mypy==1.19.1", "pytest-cov==7.0.0"]

# Incremental V4 gate, not a claim that legacy application code is fully typed.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
files = ["app/core/clock.py", "app/storage/migrations.py", "app/storage/trigger_state.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
