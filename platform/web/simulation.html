<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>桂子问津 · 仿真实验室</title>
<style>
:root{--bg0:#0d1117;--bg1:#161b22;--bg2:#1c2128;--border:#30363d;--soft:#21262d;--tx:#e6edf3;--muted:#8b949e;--green:#3fb950;--blue:#58a6ff;--yellow:#d29922;--red:#f85149;color-scheme:dark;font:13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0;background:var(--bg0);color:var(--tx)}
*{box-sizing:border-box;letter-spacing:0}body{margin:0}header{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 24px;background:var(--bg1);border-bottom:1px solid var(--border)}h1{font-size:16px;margin:0}header span{color:var(--yellow);font-size:11px}main{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 52px)}aside{padding:24px 18px;background:var(--bg1);border-right:1px solid var(--border);min-width:0}.content{min-width:0;padding:0 25px 25px}.band{border-bottom:1px solid var(--soft);padding:20px 0}h2{font-size:14px;margin:0 0 14px}label{display:block;color:var(--muted);font-size:12px;margin:0 0 16px}select,input{display:block;width:100%;min-width:0;margin-top:6px;padding:8px;border-radius:6px;border:1px solid var(--border);color:var(--tx);background:var(--bg0);font:inherit}button{border:1px solid var(--border);border-radius:6px;background:var(--bg2);padding:8px 12px;min-height:34px;color:var(--tx);font:inherit;cursor:pointer}button:hover:not(:disabled){border-color:var(--muted)}button:disabled{opacity:.45;cursor:default}button.primary{color:var(--green);border-color:var(--green);background:#1a3a22}button.stop{color:var(--red)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:28px;overflow-wrap:anywhere;line-height:1.6;color:var(--green);margin:16px 0 0}.error{color:var(--red)}.muted{color:var(--muted);font-size:12px;line-height:1.6;overflow-wrap:anywhere}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:16px 0}.metrics label{margin:0}.metrics strong{display:block;font:22px ui-monospace,Consolas,monospace;color:var(--green);margin-top:8px;overflow-wrap:anywhere}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:6px}table{border-collapse:collapse;table-layout:fixed;width:100%;font-size:12px}th,td{padding:10px 8px;overflow-wrap:anywhere;text-align:left;border-bottom:1px solid var(--border)}th{background:var(--bg2);color:var(--muted);font-weight:400}td{background:var(--bg1)}td button{padding:5px 8px;font-size:11px}pre{font:12px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;color:var(--muted);margin:0}.empty{padding:14px 0;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.row h2{margin:0}.hidden{display:none}
@media(max-width:700px){header{padding:12px;align-items:flex-start}header span{max-width:112px;text-align:right;line-height:1.5}h1{font-size:15px}main{display:block}aside{border-right:0;border-bottom:1px solid var(--border);padding:18px 14px}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}form .actions,form .status{grid-column:1/-1}.content{padding:0 14px 18px}.metrics{gap:8px}.metrics strong{font-size:18px}th,td{padding:8px 5px}.band{padding:18px 0}}
</style>
</head>
<body>
<header><h1>桂子问津 · 仿真实验室</h1><span>合成实验 · 非真人效果</span></header>
<main>
<aside><h2>实验配置</h2><form id="configuration">
<label>学习者画像<select id="profile" required></select></label>
<label>场景<select id="scenario" required></select></label>
<label>随机种子<input id="seed" type="number" min="0" max="2147483647" step="1" value="1" required></label>
<label>回合预算<input id="turns" type="number" min="1" max="100" step="1" value="20" required></label>
<div class="actions"><button id="start" class="primary" type="submit" disabled>开始运行</button><button id="stop" class="stop" type="button" disabled>停止</button><button id="resume" type="button" disabled>恢复运行</button></div>
<p id="notice" class="status" role="status" aria-live="polite">正在连接本地实验室</p>
</form></aside>
<div class="content">
<section class="band"><div class="row"><h2>运行状态</h2><button id="refresh" type="button">刷新</button></div>
<div class="metrics"><label>当前作业<strong id="state">—</strong></label><label>回合数<strong id="turn-count">—</strong></label><label>仿真错误数<strong id="errors">—</strong></label></div>
<p id="run-id" class="muted">暂无运行</p>
<div class="table-wrap"><table><thead><tr><th>画像 / 场景</th><th>Seed / 预算</th><th>状态</th><th>结果</th></tr></thead><tbody id="jobs"><tr><td colspan="4">暂无实验作业</td></tr></tbody></table></div>
</section>
<section class="band"><div class="row"><h2>评估报告</h2><button id="download" disabled>下载报告</button></div><p class="muted" id="scope">synthetic_ai_generated · 自动晋级关闭</p><pre id="report" class="empty">暂无报告</pre></section>
<section class="band"><h2>结构化轨迹</h2><pre id="transcript" class="empty">暂无轨迹</pre></section>
</div></main>
<script>
const $=id=>document.getElementById(id);let token='',jobs=[],selected=null,report=null,profiles={},scenarios={},polling=false;
const states={queued:'排队',running:'运行中',stopping:'正在停止',stopped:'已停止',completed:'已完成',failed:'失败',timed_out:'预算超时',unsupported:'题型不支持',interrupted:'进程中断，检查后恢复'};
const active=job=>['queued','running','stopping'].includes(job?.state);
function notice(message,error=false){$('notice').textContent=message;$('notice').classList.toggle('error',error)}
async function api(path,body){const response=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json','x-lab-token':token},body:body===undefined?undefined:JSON.stringify(body)});const value=await response.json();if(!response.ok)throw Error(typeof value.detail==='string'?value.detail:JSON.stringify(value.detail));return value}
function text(tag,value){const element=document.createElement(tag);element.textContent=value;return element}
function choose(id){selected=id;report=null;$('report').textContent='暂无报告';$('transcript').textContent='暂无轨迹';$('download').disabled=true;loadResults().catch(error=>notice(error.message,true));render()}
function render(){const current=jobs.find(job=>job.job_id===selected),busy=jobs.some(active);$('start').disabled=!token||busy;$('stop').disabled=!active(current)||current.state==='stopping';$('resume').disabled=busy||!current?.resumable||!current?.run_id;$('state').textContent=states[current?.state]||'未运行';$('run-id').textContent=current?.run_id?'Run '+current.run_id:current?'Job '+current.job_id:'暂无运行';$('jobs').replaceChildren();if(!jobs.length){const tr=document.createElement('tr'),td=text('td','暂无实验作业');td.colSpan=4;tr.append(td);$('jobs').append(tr)}for(const job of jobs){const tr=document.createElement('tr');tr.append(text('td',(profiles[job.request.profile_id]||job.request.profile_id)+' / '+(scenarios[job.request.scenario_id]||job.request.scenario_id)),text('td',job.request.seed+' / '+job.request.max_turns),text('td',states[job.state]||job.state));const td=document.createElement('td'),button=text('button',job.job_id===selected?'当前':'查看');button.type='button';button.onclick=()=>choose(job.job_id);td.append(button);tr.append(td);$('jobs').append(tr)}if(current?.state==='failed')notice('作业失败：'+current.error,true)}
async function loadResults(){const current=jobs.find(job=>job.job_id===selected);if(!current||active(current)||!current.run_id)return;const jobId=current.job_id,result=await api('/api/lab/jobs/'+jobId+'/report');if(selected!==jobId)return;report=result;$('report').textContent=JSON.stringify(result,null,2);$('report').classList.remove('empty');$('download').disabled=false;$('turn-count').textContent=result.turns??result.turns_completed??result.turn_count??result.metrics?.turns??'—';$('errors').textContent=result.errors?.length??result.error_count??result.metrics?.errors??'—';try{const trajectory=await api('/api/lab/jobs/'+jobId+'/transcript');if(selected===jobId){$('transcript').textContent=trajectory.events.map(item=>JSON.stringify(item)).join('\n')||'暂无轨迹';$('transcript').classList.remove('empty')}}catch(error){if(selected===jobId)$('transcript').textContent=error.message}}
async function refresh(){if(polling)return;polling=true;try{jobs=(await api('/api/lab/jobs')).jobs;if(!selected&&jobs.length)selected=jobs[0].job_id;render();if(!report)await loadResults()}catch(error){notice(error.message,true)}finally{polling=false}}
$('configuration').onsubmit=async event=>{event.preventDefault();$('start').disabled=true;try{const job=await api('/api/lab/jobs',{profile_id:$('profile').value,scenario_id:$('scenario').value,seed:Number($('seed').value),max_turns:Number($('turns').value)});selected=job.job_id;report=null;$('report').textContent='暂无报告';$('transcript').textContent='暂无轨迹';$('turn-count').textContent='—';$('errors').textContent='—';$('download').disabled=true;notice('实验已启动');await refresh()}catch(error){notice(error.message,true);render()}};
$('stop').onclick=async()=>{if(!selected)return;$('stop').disabled=true;try{await api('/api/lab/jobs/'+selected+'/stop',{});notice('停止请求已发送');await refresh()}catch(error){notice(error.message,true);render()}};
$('resume').onclick=async()=>{if(!selected)return;$('resume').disabled=true;try{const job=await api('/api/lab/jobs/'+selected+'/resume',{});selected=job.job_id;report=null;$('report').textContent='暂无报告';$('transcript').textContent='暂无轨迹';$('download').disabled=true;notice('检查点恢复已启动');await refresh()}catch(error){notice(error.message,true);render()}};
$('refresh').onclick=refresh;$('download').onclick=()=>{if(!report)return;const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='synthetic-report-'+selected+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
async function init(){try{const config=await api('/api/lab/config');token=config.token;profiles=config.profiles;scenarios=config.scenarios;for(const [id,name] of Object.entries(profiles)){const option=text('option',name);option.value=id;$('profile').append(option)}for(const [id,name] of Object.entries(scenarios)){const option=text('option',name);option.value=id;$('scenario').append(option)}notice('实验室已就绪');await refresh()}catch(error){notice(error.message,true)}}
init();setInterval(()=>{if(jobs.some(active))refresh()},1000);
</script>
</body></html>
