<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桂子问津 · 教师复核工作台</title><link rel="stylesheet" href="/assets/workbench/tokens.css"><link rel="stylesheet" href="/assets/workbench/workbench.css"><link rel="stylesheet" href="/assets/workbench/wenjin-theme.css"><script defer src="/assets/workbench/staff.js"></script></head><body class="staff-page" data-surface="teacher"><header class="topbar"><a class="logo" href="/"><span class="brand-seal">问</span><span class="brand"><b>桂子问津</b><small>问津，而后自渡</small></span></a><div class="staff-links"><a href="/">陪学</a><a href="/teacher">教师</a><a href="/parent">家长</a><a href="/research">研究治理</a></div></header><main><div class="staff-header"><h1>教师复核工作台</h1><p>本地研究 MVP 独立操作面，不是学校 SSO 或完整机构身份系统。</p></div><p id="status" role="status" aria-live="polite"></p><div class="band"><h2>授权教师看板</h2><label>本次操作凭据<input id="staff-token" type="password" autocomplete="off"></label><button id="load-dashboard">读取教师摘要</button><p class="muted">凭据不保存，每次操作后清空；教学用途、学生共享与教师权限由服务器校验。</p><div id="dashboard-result"></div></div><div class="band"><h2>作答复核</h2><label>待复核记录编号<input id="correction-evidence"></label><div class="row"><label>结果<select id="correction-status"><option value="passed">通过</option><option value="failed">未通过</option><option value="partial">部分通过</option><option value="unverifiable">无法验证</option></select></label><label>分数（0–1）<input id="correction-score" type="number" min="0" max="1" step=".05" value="1"></label><label>置信度（0–1）<input id="correction-confidence" type="number" min="0" max="1" step=".05" value=".9"></label></div><label>复核理由<textarea id="correction-reason"></textarea></label><button id="teacher-correct">追加复核记录</button><h3>定性作品与评分规则</h3><label>评分规则<select id="qualitative-rubric"></select></label><label>审核版本<input id="assessor-version" value="local-teacher-review-v1"></label><div id="rubric-dimensions"></div><div class="actions"><button id="read-artifact">读取授权作品</button><button id="qualitative-review">追加维度评审</button></div><div id="artifact-result"></div><div id="correction-result"></div></div></main></body></html>
